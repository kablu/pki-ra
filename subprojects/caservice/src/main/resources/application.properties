# =============================================================================
# CA Service — application.properties
# =============================================================================

spring.application.name=pki-ca-service
server.port=8082

# -----------------------------------------------------------------------------
# CA Configuration
# -----------------------------------------------------------------------------

# Keystore (PKCS12) — generated on first run if absent
ca.keystore-path=${CA_KEYSTORE_PATH:ca-keystore.p12}
ca.keystore-password=${CA_KEYSTORE_PASSWORD:changeit}

# Key aliases inside the keystore
ca.root-alias=root-ca
ca.intermediate-alias=intermediate-ca

# Certificate validity
ca.root-validity-years=20
ca.intermediate-validity-years=10
ca.end-entity-validity-days=365

# Default algorithm for CA key generation: RSA or ECDSA
ca.default-algorithm=${CA_DEFAULT_ALGORITHM:RSA}

# RSA parameters (used when ca.default-algorithm=RSA)
ca.rsa-key-size=4096

# ECDSA parameters (used when ca.default-algorithm=ECDSA)
ca.ec-curve=P-384

# Distinguished Names
ca.root-dn=CN=PKI Root CA, O=PKI Organization, OU=Certificate Authority, C=IN
ca.intermediate-dn=CN=PKI Intermediate CA, O=PKI Organization, OU=Certificate Authority, C=IN

# CRL / OCSP (leave empty to omit extensions)
ca.crl-distribution-point=
ca.ocsp-url=

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Swagger / OpenAPI
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.pki.ca=DEBUG
logging.level.org.springframework.web=INFO
